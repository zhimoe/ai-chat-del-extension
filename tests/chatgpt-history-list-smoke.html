<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../styles.css">
    <title>ChatGPT history list smoke test</title>
  </head>
  <body>
    <div id="history-host">
      <div class="history-list" role="list" tabindex="-1">
        <div data-sidebar-chatgpt-conversation-key="chatgpt:conversation:11111111-1111-1111-1111-111111111111" role="listitem">
          <div role="group" aria-label="第一条会话">
            <div data-thread-title-trigger="true">
              <a data-interactive-row-link="true" href="/c/11111111-1111-1111-1111-111111111111">
                <span data-thread-title="true"><span dir="auto">第一条会话</span></span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__smokeIntervals = [];
      const nativeSetInterval = window.setInterval.bind(window);
      window.setInterval = (...args) => {
        const id = nativeSetInterval(...args);
        window.__smokeIntervals.push(id);
        return id;
      };
    </script>
    <script src="../content.js"></script>
    <script>
      window.setTimeout(() => {
        document.querySelector("[data-cgpt-toggle]")?.click();

        // 模拟 React 整体替换历史列表，管理工具条和复选框都应自动恢复。
        document.querySelector("#history-host").innerHTML = `
          <div class="history-list" role="list" tabindex="-1">
            <div data-sidebar-chatgpt-conversation-key="chatgpt:conversation:22222222-2222-2222-2222-222222222222" role="listitem">
              <div role="group" aria-label="重挂载后的会话">
                <div data-thread-title-trigger="true">
                  <a data-interactive-row-link="true" href="/c/22222222-2222-2222-2222-222222222222">
                    <span data-thread-title="true"><span dir="auto">重挂载后的会话</span></span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;
      }, 50);

      window.setTimeout(() => {
        const toolbar = document.querySelector("#cgpt-bulk-toolbar");
        const list = document.querySelector('#history-host [role="list"]');
        const link = document.querySelector('a[href*="22222222"]');
        const passed =
          toolbar?.nextElementSibling === list &&
          toolbar?.dataset.site === "chatgpt" &&
          Boolean(link?.querySelector(".cgpt-bulk-checkbox"));
        document.body.dataset.smokeResult = passed ? "pass" : "fail";
        window.__smokeIntervals.forEach(window.clearInterval);
      }, 700);
    </script>
  </body>
</html>
